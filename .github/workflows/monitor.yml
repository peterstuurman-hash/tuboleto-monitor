name: Tuboleto 2A monitor

on:
  schedule:
    # Eén start per uur. GitHub laat geplande starts vallen, en knijpt juist de repo's af die er
    # veel vragen. We vragen er daarom 24 per dag in plaats van 132 en doen het meetwerk binnen
    # de job zelf: een gemiste start kost één uur in plaats van een willekeurig gat.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuboleto-monitor
  cancel-in-progress: false

jobs:
  meting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installeer Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Meet dit uur vol
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"

          uur=$(TZ=America/Lima date +%-H)
          # Overdag in Peru elk kwartier. Rond het moment dat de volgende dag opengaat (13:45-14:30
          # Peruaanse tijd) elke vijf minuten. Buiten die uren één meting per uur.
          case "$uur" in
            13|14)        interval=300 ;;
            [6-9]|1[0-6]) interval=900 ;;
            *)            interval=0 ;;
          esac

          # Stoppen op 55 minuten na het hele uur, zodat de start van het volgende uur niet achter
          # deze job in de wachtrij komt.
          nu=$(date -u +%s)
          deadline=$(( nu - (nu % 3600) + 55*60 ))

          while :; do
            node tuboleto-2a-monitor.js || echo "meting mislukt, we gaan door"

            # Eerst de nieuwe regels veiligstellen, dan pas ophalen: draait er een meting tegelijk,
            # dan zet de rebase onze regels er netjes achter in plaats van dat er één verdwijnt.
            git add -A tuboleto_log.csv tuboleto_2a_log.csv
            git commit -m "meting $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "geen wijziging"
            git pull --rebase origin main || true
            git push || true

            if [ "$interval" -eq 0 ]; then break; fi
            nu=$(date -u +%s)
            volgende=$(( nu + interval - (nu % interval) ))
            if [ "$volgende" -ge "$deadline" ]; then break; fi
            sleep $(( volgende - nu ))
          done
