name: Tuboleto 2A monitor

on:
  schedule:
    # Overdag elk kwartier. GitHub voert geplande workflows uit wanneer het uitkomt, dus in de
    # praktijk komen er 75 tot 81 metingen per dag binnen in plaats van 96.
    - cron: '*/15 * * * *'
    # Extra dicht op het moment dat de volgende dag opengaat: dat gebeurt rond 13:45-14:30
    # Peruaanse tijd, dus 18:45-19:30 UTC. Vijf minuten is het fijnste raster dat GitHub toestaat.
    - cron: '*/5 18-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuboleto-monitor
  cancel-in-progress: false

jobs:
  meting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installeer Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Voer meting uit
        run: node tuboleto-2a-monitor.js
      - name: Sla resultaat op
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          # Eerst de nieuwe regels veiligstellen, dan pas ophalen: draait er een meting tegelijk,
          # dan zet de rebase onze regels er netjes achter in plaats van dat er één verdwijnt.
          git add -A tuboleto_log.csv tuboleto_2a_log.csv
          git commit -m "meting $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "geen wijziging"
          git pull --rebase origin main || true
          git push
