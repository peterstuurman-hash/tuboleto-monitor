name: Tuboleto 2A monitor

on:
  schedule:
    # Eén start per uur. GitHub laat geplande starts vallen, en knijpt juist de repo's af die er
    # veel vragen. We vragen er daarom 24 per dag in plaats van 132 en doen het meetwerk binnen
    # de job zelf: een gemiste start kost één uur in plaats van een willekeurig gat.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuboleto-monitor
  cancel-in-progress: false

jobs:
  meting:
    runs-on: ubuntu-latest
    # Krap onder het uur. Loopt een job langer, dan staat de start van het volgende uur in de
    # wachtrij en verlies je dat uur er ook nog bij.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installeer Playwright
        # 'playwright install --with-deps' draait een apt-get update, en die liep op 7 oktober een
        # uur lang vast op archive.ubuntu.com. Vijf minuten per poging, twee pogingen: een hapering
        # kost nu een paar minuten van dit uur in plaats van het hele uur plus het volgende.
        timeout-minutes: 12
        run: |
          timeout 240 npm install playwright || timeout 240 npm install playwright
          if ! timeout 300 npx playwright install --with-deps chromium; then
            echo "installatie liep vast, nog één poging"
            timeout 300 npx playwright install --with-deps chromium
          fi
      - name: Meet dit uur vol
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"

          uur=$(TZ=America/Lima date +%-H)
          # Overdag in Peru elk kwartier. Rond het moment dat de volgende dag opengaat (13:45-14:30
          # Peruaanse tijd) elke vijf minuten. Buiten die uren één meting per uur.
          case "$uur" in
            13|14)        interval=300 ;;
            [6-9]|1[0-6]) interval=900 ;;
            *)            interval=0 ;;
          esac

          # Stoppen op 55 minuten na het hele uur, zodat de start van het volgende uur niet achter
          # deze job in de wachtrij komt.
          nu=$(date -u +%s)
          deadline=$(( nu - (nu % 3600) + 55*60 ))

          gelukt=0
          mislukt=0

          # Het script kijkt zelf een minuut mee en heeft eigen timeouts, maar een vastgelopen
          # browser mag de rest van het uur niet opeten.
          meet() { timeout 240 node tuboleto-2a-monitor.js; }

          while :; do
            # Eén herkansing. De site hapert af en toe en levert dan geen disponibilidad-antwoord;
            # buiten het meetvenster is dit de enige meting van het uur, dus dat is het wachten waard.
            if meet; then
              gelukt=$(( gelukt + 1 ))
            else
              echo "meting mislukt, over 30 seconden nog één keer"
              sleep 30
              if meet; then
                gelukt=$(( gelukt + 1 ))
              else
                mislukt=$(( mislukt + 1 ))
                echo "ook de herkansing mislukte, we gaan door"
              fi
            fi

            # Eerst de nieuwe regels veiligstellen, dan pas ophalen: draait er een meting tegelijk,
            # dan zet de rebase onze regels er netjes achter in plaats van dat er één verdwijnt.
            git add -A tuboleto_log.csv tuboleto_2a_log.csv
            git commit -m "meting $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "geen wijziging"
            timeout 120 git pull --rebase origin main || true
            timeout 120 git push || true

            if [ "$interval" -eq 0 ]; then break; fi
            nu=$(date -u +%s)
            volgende=$(( nu + interval - (nu % interval) ))
            if [ "$volgende" -ge "$deadline" ]; then break; fi
            sleep $(( volgende - nu ))
          done

          echo "dit uur: $gelukt gelukt, $mislukt mislukt"
          # Rood maken als er dit uur niets gemeten is. Anders staat Actions vol vinkjes terwijl
          # de data stilstaat, en dat is precies het verkeerde signaal.
          if [ "$gelukt" -eq 0 ]; then
            echo "::error::geen enkele meting gelukt dit uur"
            exit 1
          fi
